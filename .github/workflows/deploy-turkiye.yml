name: Deploy Turkiye
on:
  push:
    branches: [main]
    paths:
      - 'turkiye/**'
      - '.github/workflows/deploy-turkiye.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-turkiye-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure restricted SSH deployment
        env:
          DEPLOY_KEY: ${{ secrets.TURKIYE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TURKIYE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/turkiye_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/turkiye_key ~/.ssh/known_hosts
      - name: Validate artifact and record revision
        run: |
          python3 - <<'PY'
          import pathlib, re, json, os, hashlib, datetime
          root = pathlib.Path('turkiye')
          assert (root/'index.html').is_file(), 'Missing built turkiye/index.html'
          assert not any(p.is_symlink() for p in root.rglob('*')), 'Symlinks are not deployable'
          html = (root/'index.html').read_text()
          refs = re.findall(r'(?:src|href)="(/turkiye/assets/[^"?#]+)"', html)
          assert refs, 'Missing bundled assets'
          for ref in refs:
              rel = pathlib.PurePosixPath(ref.removeprefix('/turkiye/'))
              assert '..' not in rel.parts and (root/str(rel)).is_file(), ref
          meta = {'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                  'deployedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'indexSha256': hashlib.sha256((root/'index.html').read_bytes()).hexdigest()}
          (root/'deployment.json').write_text(json.dumps(meta, indent=2)+'\n')
          PY
      - name: Upload assets then publish entry
        run: |
          set -euo pipefail
          export RSYNC_RSH='ssh -i /home/runner/.ssh/turkiye_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20'
          # Keep old hashed assets for visitors who still have the previous page open.
          rsync -rtz --delay-updates --chmod=D755,F644 --exclude=index.html --exclude=deployment.json turkiye/ ubuntu@152.32.132.169:./
          rsync -rtz --delay-updates --chmod=F644 turkiye/index.html turkiye/deployment.json ubuntu@152.32.132.169:./
      - name: Verify public HTML, bundles and revision
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, json, re, time, os
          base = 'https://renezhang.fun'
          root = pathlib.Path('turkiye')
          def get(path):
              req = urllib.request.Request(base+path+'?release='+os.environ['GITHUB_SHA'], headers={'Cache-Control':'no-cache'})
              return urllib.request.urlopen(req, timeout=30).read()
          for attempt in range(3):
              try:
                  html = get('/turkiye/')
                  assert html == (root/'index.html').read_bytes(), 'Published HTML differs'
                  for ref in re.findall(rb'(?:src|href)="(/turkiye/assets/[^"?#]+)"',html):
                      ref = ref.decode()
                      assert get(ref) == pathlib.Path(ref.lstrip('/')).read_bytes(), ref
                  meta = json.loads(get('/turkiye/deployment.json'))
                  assert meta['commit'] == os.environ['GITHUB_SHA'], meta
                  print('Verified production revision:',meta['commit'])
                  break
              except Exception:
                  if attempt == 2: raise
                  time.sleep(5)
          PY
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/turkiye_key
